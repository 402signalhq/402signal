name: public-lab-readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-lab-readiness.yml'
      - 'scripts/public_lab_check.py'
      - 'tests/test_public_lab_check.py'

permissions:
  contents: read

jobs:
  unpaid-challenge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Install locked dependencies on the hosted runner
        run: pip install --require-hashes -r requirements.txt
      - name: Verify diagnostic safety with fixtures
        env:
          LIVE402_FIXTURE: "1"
        run: python -m unittest discover -s tests -p test_public_lab_check.py -v
      - name: Read public lab challenges without any payment authorization
        # Fixed public URLs; GET only; no tokens, payment headers, route POST,
        # history/replay/PQ writes, deployment or private provider access.
        run: python -m scripts.public_lab_check
