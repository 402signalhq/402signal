name: website browser evidence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select runner-provided Node 24
        run: |
          node_dir="$(find "$RUNNER_TOOL_CACHE/node" -mindepth 3 -maxdepth 3 -type d -path '*/24.*/x64/bin' -print | sort -V | tail -n 1)"
          test -n "$node_dir"
          "$node_dir/node" -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
          printf '%s\n' "$node_dir" >> "$GITHUB_PATH"
      - name: Install locked isolated browser tooling
        working-directory: integration/website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --package-lock-only --ignore-scripts --audit-level=high
          ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test customer flows and mobile layouts with synthetic data
        run: node integration/website/browser.mjs
      - name: Record exact qualification revision
        if: always()
        run: |
          git rev-parse HEAD
          if [ -f website-evidence/results.json ]; then cat website-evidence/results.json; fi
          if [ -f website-evidence/summary.md ]; then cat website-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
