name: Publish route-guard to npm

# Publishes sdk/route-guard to the npm registry with provenance. Runs only
# from a version tag or a manual dispatch naming one. Uses the NPM_TOKEN
# secret from the `release` environment for the first publish; once the
# package exists, switch it to npm Trusted Publishing and delete the token.
on:
  push:
    tags:
      - "route-guard-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example route-guard-v0.8.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # The repository allows only a short list of actions (setup-node is not
      # on it), so the runner's preinstalled Node is used and checked.
      - name: Check the runner's Node and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version; npm --version
          major="$(node -p 'Number(process.versions.node.split(".")[0])')"
          test "$major" -ge 22 || { echo "Node 22 or newer is required (package engines)"; exit 1; }

      - name: Check the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./sdk/route-guard/package.json').version")"
          test "$ref" = "route-guard-v$version" || { echo "tag $ref does not match package version $version"; exit 1; }

      - name: Test the package (zero dependencies, no network)
        run: |
          npm --prefix sdk/route-guard run check
          npm --prefix sdk/route-guard test

      - name: Publish with provenance
        working-directory: sdk/route-guard
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm expands ${NODE_AUTH_TOKEN} itself when it reads .npmrc; the
        # token never appears on a command line or in the log.
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"
          npm publish --provenance --access public --ignore-scripts
          rm -f "$HOME/.npmrc"
