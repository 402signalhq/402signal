name: Publish route-guard to npm

# Publishes sdk/route-guard to the npm registry with provenance through npm
# Trusted Publishing: the job's GitHub OIDC token is exchanged for a
# short-lived publish credential, so no npm token is stored anywhere. The
# trusted publisher on npmjs.com is this repository, this workflow file and
# the `release` environment. Runs only from a version tag or a manual
# dispatch naming one.
on:
  push:
    tags:
      - "route-guard-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example route-guard-v0.8.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # The repository allows only a short list of actions (setup-node is not
      # on it), so the runner's preinstalled Node is used and checked.
      - name: Check the runner's Node and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version; npm --version
          major="$(node -p 'Number(process.versions.node.split(".")[0])')"
          test "$major" -ge 22 || { echo "Node 22 or newer is required (package engines)"; exit 1; }

      - name: Check the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./sdk/route-guard/package.json').version")"
          test "$ref" = "route-guard-v$version" || { echo "tag $ref does not match package version $version"; exit 1; }

      - name: Test the package (zero dependencies, no network)
        run: |
          npm --prefix sdk/route-guard run check
          npm --prefix sdk/route-guard test

      - name: Publish with provenance (npm Trusted Publishing)
        working-directory: sdk/route-guard
        shell: bash
        # Trusted Publishing needs npm 11.5.1 or newer. No token, no .npmrc:
        # npm requests the OIDC token from the job itself. The runner's npm is
        # used when it is new enough; otherwise npm 11 is installed into a
        # job-local prefix. Never a global install: on the ubuntu-24.04 image
        # `npm install -g` fails with EACCES on /usr/local/share/man
        # (run 34790149245, 2026-09-13).
        run: |
          set -euo pipefail
          node --version; npm --version
          recent() { node -e 'const [a,b,c]=process.argv[1].trim().split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$1"; }
          NPM=npm
          if ! recent "$(npm --version)"; then
            npm install --prefix "$RUNNER_TEMP/npm11" --no-audit --no-fund --ignore-scripts npm@11 >/dev/null
            NPM="node $RUNNER_TEMP/npm11/node_modules/npm/bin/npm-cli.js"
          fi
          $NPM --version
          recent "$($NPM --version)" || { echo "npm 11.5.1+ required"; exit 1; }
          $NPM publish --provenance --access public --ignore-scripts
