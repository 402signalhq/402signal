name: Publish 402signal to PyPI

# Publishes sdk/python to PyPI with Trusted Publishing (OIDC, no API token).
# PyPI side: Account settings > Publishing > "Add a new pending publisher" with
# project 402signal, owner 402signalhq, repository 402signal, workflow
# publish-pypi.yml, environment release. Runs only from a version tag or a
# manual dispatch naming one.
on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example python-v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml","rb"))["project"]["version"])')"
          test "$ref" = "python-v$version" || { echo "tag $ref does not match package version $version"; exit 1; }

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "build==1.2.2.post1" "cryptography>=42"
          PYTHONPATH=sdk/python/src python3 -m unittest discover -s sdk/python/tests -v
          python3 -m build --sdist --wheel --outdir dist sdk/python
          ls -l dist

      - name: Publish to PyPI (Trusted Publishing, attestations on)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
