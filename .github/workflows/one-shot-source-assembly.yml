name: one-shot source assembly
# Temporary source-edit helper; no checkout, repository execution, commits or ref writes.
on:
  push:
    branches: [feat/customer-experience-mobile]
permissions: {}
jobs:
  assemble:
    if: github.repository == '402signalhq/402signal' && github.actor == 'ross402signal' && github.event.before == 'efd5afed1fcf6bba65f2a82e211de076de65aa1c'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Create hash-verified unattached source blobs for explicit review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, urllib.request
          REPO = '402signalhq/402signal'
          SOURCE = '9d7f9c25581e6e8466a4159208609a5326daef51'
          BASE = 'https://api.github.com/repos/' + REPO
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/customer-experience-mobile'
          assert os.environ['GITHUB_ACTOR'] == 'ross402signal'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('Redirect refused')
          opener = urllib.request.build_opener(NoRedirect())
          def api(path, payload=None):
              assert path.startswith(('/git/blobs/', '/git/commits/', '/git/trees/')) or path == '/git/blobs'
              assert payload is None or path == '/git/blobs'
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(BASE + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json', 'User-Agent': '402signal-source-assembly'})
              with opener.open(request, timeout=20) as response:
                  return json.loads(response.read(1048576))
          commit = api('/git/commits/' + os.environ['GITHUB_SHA'])
          assert [p['sha'] for p in commit['parents']] == ['efd5afed1fcf6bba65f2a82e211de076de65aa1c']
          original = api('/git/trees/' + SOURCE + '?recursive=1')
          assert original.get('truncated') is False
          entries = {entry['path']: entry for entry in original['tree']}
          edited = ['tests/test_route.py', 'tests/test_pq_testnet_d.py', 'tests/test_transparency.py',
                    'live402/schema_fields.py', 'live402/mcp.py', 'live402/static/index.html',
                    'live402/static/developers.html', 'tests/test_homepage.py']
          retained = ['live402/static/catalog.html', 'live402/static/how.html', 'live402/static/app.js',
                      'live402/static/styles.css', 'integration/website/package.json',
                      'integration/website/package-lock.json', 'integration/website/browser.mjs',
                      '.github/workflows/website-browser.yml']
          sources = {}
          for path in edited:
              entry = entries[path]
              assert entry['type'] == 'blob' and entry['mode'] == '100644'
              blob = api('/git/blobs/' + entry['sha'])
              assert blob['encoding'] == 'base64'
              raw = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == entry['sha']
              sources[path] = raw.decode('utf-8')
          def replace(path, old, new, count=1):
              assert sources[path].count(old) == count, (path, old, sources[path].count(old))
              sources[path] = sources[path].replace(old, new)
          for path, count in [('tests/test_route.py', 1), ('tests/test_pq_testnet_d.py', 2), ('tests/test_transparency.py', 1)]:
              replace(path, 'Check paid APIs before your agent spends.', 'Check the offer before your agent pays.', count)
          replace('tests/test_route.py', '$0.003 USDC per successful API check', '$0.003 USDC when a supported offer qualifies under your rules')
          replace('tests/test_route.py', 'For agents buying API access', 'Pre-spend checks for paid APIs', 2)
          replace('tests/test_route.py', 'q.get("need")', 'query.get("need")')
          replace('tests/test_route.py', 'chips.addEventListener("click"', '$("need-chips").addEventListener("click"')
          for old, new in [('#2a2a32', '#25252d'), ('#c8ad88', '#c8b698'), ('#14141a', '#17171d')]:
              replace('tests/test_route.py', old, new)
          old_function = '''def route_body_schema() -> dict:
              props = need_or_url_schema()
              props.update(route_constraint_properties())
              return {
                  "type": "object",
                  "properties": props,
                  "anyOf": list(NEED_OR_URL_ANYOF),
                  "additionalProperties": False,
              }
          '''
          new_function = '''def route_body_schema(*, surface: str = "http") -> dict:
              """Advertise HTTP profiles separately from the existing MCP contract."""
              props = need_or_url_schema()
              props.update(route_constraint_properties())
              result = {
                  "type": "object",
                  "properties": props,
                  "anyOf": list(NEED_OR_URL_ANYOF),
                  "additionalProperties": False,
              }
              if surface == "mcp":
                  return result
              if surface != "http":
                  raise ValueError("unknown schema surface")
              from live402.schema_http import extend_http_route_schema
              return extend_http_route_schema(result)
          '''
          replace('live402/schema_fields.py', old_function, new_function)
          replace('live402/mcp.py', 'INPUT_SCHEMA = schema_fields.route_body_schema()', 'INPUT_SCHEMA = schema_fields.route_body_schema(surface="mcp")')
          replace('live402/static/index.html', '<p>402Signal · Check paid APIs before your agent spends.</p>', '<p>402Signal</p>')
          replace('live402/static/index.html', "The Algorand lab's MainNet paid test is complete. Base batch and native Solana session paid qualification remain in progress.", 'Controlled MainNet tests are complete for Base batch, Solana MPP push sessions and Algorand two-item groups at owner-operated lab endpoints. Long-running or high-count sessions are not yet qualified.')
          replace('live402/static/developers.html', 'Live paid qualification is still in progress.', 'Controlled MainNet payment and settlement tests are complete at owner-operated lab endpoints.', 2)
          replace('live402/static/developers.html', 'The observation fee is $0.003.', 'Controlled Base and Solana campaigns covered two merchant calls, settlement checks and return of unused capital. Delivery observations must remain within their original short validity window; long-running or high-count sessions are not yet qualified. The observation fee is $0.003.')
          replace('tests/test_homepage.py', '"paid qualification remain in progress"', '"Controlled MainNet tests are complete"')
          replace('tests/test_homepage.py', '"MainNet paid test is complete"', '"owner-operated lab endpoints"')
          for path, source in sources.items():
              if path.endswith('.py'):
                  ast.parse(source, filename=path)
          outputs = []
          for path, source in sources.items():
              raw = source.encode('utf-8')
              expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              result = api('/git/blobs', {'content': source, 'encoding': 'utf-8'})
              assert result['sha'] == expected
              outputs.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
          for path in retained:
              entry = entries[path]
              assert entry['type'] == 'blob' and entry['mode'] == '100644'
              outputs.append({k: entry[k] for k in ('path', 'mode', 'type', 'sha')})
          print('SOURCE_ENTRIES=' + json.dumps(outputs, separators=(',', ':')))
          print('No ref, main, payment, production configuration or repository protection was changed.')
          PY
