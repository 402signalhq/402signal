name: customer site review
on:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect exact public review files
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          paths=['live402/static/styles.css','live402/static/app.js','live402/static/contact.html','live402/static/pre-spend-routing.html','live402/discover.py','integration/website/browser.mjs','integration/website/extended.mjs','tests/test_homepage.py']
          for name in paths:
              data=pathlib.Path(name).read_bytes()
              print('SOURCE',name,hashlib.sha256(data).hexdigest(),base64.b64encode(gzip.compress(data,mtime=0)).decode())
          PY
