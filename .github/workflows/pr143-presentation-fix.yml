name: one-time PR143 presentation correction
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  correct:
    if: github.repository == '402signalhq/402signal' && github.event.pull_request.number == 143 && github.event.pull_request.head.repo.full_name == '402signalhq/402signal' && github.head_ref == 'feat/customer-first-site-and-agent-guides'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Apply reviewed anchor wording and link corrections only
        env:
          EXPECTED_EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          test "$(git rev-parse HEAD^)" = '825ed1065cea04345000e44aef087601c72a73dc'
          python3 - <<'PY'
          import ast
          from pathlib import Path
          import subprocess
          def change(path, edits):
              p=Path(path)
              assert p.is_file() and not p.is_symlink(),path
              before=p.read_text(); after=before
              for old,new in edits:
                  assert old in after,(path,old)
                  after=after.replace(old,new)
              if path.endswith('.py'):
                  a,b=ast.parse(before),ast.parse(after)
                  names=lambda t: sorted(n.name for n in ast.walk(t) if isinstance(n,ast.FunctionDef) and n.name.startswith('test_'))
                  assertions=lambda t: sum(isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr.startswith('assert') for n in ast.walk(t))
                  assert names(a)==names(b),(path,'test inventory changed')
                  assert assertions(b)>=assertions(a),(path,'assertions removed')
              p.write_text(after)
          change('live402/static/index.html',[
              ('This status describes a checkpoint, not every current record. Inspect coverage and confirmation in the log.', 'Pending records are not yet confirmed on-chain. This status describes a checkpoint, not every current record. Inspect coverage in the log.'),
          ])
          change('tests/test_audit_closeout_static.py',[
              ('Checkpoints are anchored on Algorand MainNet.', 'Later Algorand MainNet checkpoints'),
              ('class="pq-trust"', 'id="pq-log"'),
          ])
          change('tests/test_pq_http.py',[
              ('Store your verification record securely', 'Keep the private request, receipt and reveal'),
          ])
          change('tests/test_pq_isolated_signer.py',[
              ('Checkpoints are anchored on Algorand MainNet. Pending records are not yet confirmed on-chain.', 'Pending records are not yet confirmed on-chain.'),
          ])
          change('tests/test_pq_testnet_d.py',[
              ('href="/transparency">Evidence, oversight and long-term verification</a>', 'href="/how#trust">Evidence, oversight and long-term verification</a>'),
          ])
          allowed={'live402/static/index.html','tests/test_audit_closeout_static.py','tests/test_pq_http.py','tests/test_pq_isolated_signer.py','tests/test_pq_testnet_d.py'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==allowed
          print('Test inventory preserved. Pending/authorized/submitted/confirmed assertions remain in place.')
          PY
          git diff --check
          git diff --stat
          git diff -- tests
      - name: Run full fixture tests without payment credentials
        env:
          LIVE402_FIXTURE: '1'
          LIVE402_ROUTE_RPM: '60'
        run: |
          pip install --require-hashes -r requirements.txt > /tmp/pr143-install.log 2>&1 || { tail -60 /tmp/pr143-install.log; exit 1; }
          python scripts/run_fixture_tests.py
      - name: Save on the same PR branch without force or merge
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch='feat/customer-first-site-and-agent-guides'
          test "$(gh api repos/402signalhq/402signal/git/ref/heads/$branch --jq '.object.sha')" = "$EXPECTED_EVENT_SHA"
          git add -- live402/static/index.html tests/test_audit_closeout_static.py tests/test_pq_http.py tests/test_pq_isolated_signer.py tests/test_pq_testnet_d.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Complete anchor-state regression coverage for the refreshed pages'
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
      - name: Export public page source for local visual inspection
        if: always()
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          for name in ['index.html','styles.css','how.html','developers.html','catalog.html','app.js']:
              data=pathlib.Path('live402/static',name).read_bytes()
              print('REVIEW_SOURCE',name,hashlib.sha256(data).hexdigest(),base64.b64encode(gzip.compress(data,mtime=0)).decode())
          PY
