name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      batch-postgres:
        image: postgres:16.15-bookworm@sha256:1938c16e9d2f10a6a3623b344b64ae8d45f407f2c5f34f0979468bb689b9227a
        env:
          POSTGRES_DB: lab_batch_ci
          POSTGRES_USER: postgres
          # Public synthetic CI credential; never used outside this job.
          POSTGRES_PASSWORD: lab-fixture-password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab_batch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Select runner-provided Node 24
        # Use the hosted tool cache under the existing action allowlist.
        run: |
          node_dir="$(find "$RUNNER_TOOL_CACHE/node" -mindepth 3 -maxdepth 3 -type d -path '*/24.*/x64/bin' -print | sort -V | tail -n 1)"
          test -n "$node_dir"
          "$node_dir/node" -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
          printf '%s\n' "$node_dir" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Run fixture tests
        env:
          LIVE402_FIXTURE: "1"
          # The fixture suite sends many requests from one loopback IP. Production
          # keeps the fail-closed 12/minute default; rate tests set their own cap.
          LIVE402_ROUTE_RPM: "60"
        run: python scripts/run_fixture_tests.py
      - name: Check local route guard (no install or live network)
        run: |
          node --version
          npm --prefix sdk/route-guard run check
          npm --prefix sdk/route-guard test
      - name: Qualify reference buyer and explicit MPP interoperability
        # Synthetic accounts only; no wallet secrets, RPC or paid requests.
        run: |
          npm --prefix integration/reference-buyer ci --ignore-scripts --no-audit --no-fund
          npm --prefix integration/mpp-client ci --ignore-scripts --no-audit --no-fund
          npm --prefix integration/mpp-algorand ci --ignore-scripts --no-audit --no-fund
          npm --prefix integration/reference-buyer test
          node integration/buyer-checks/lifecycle.mjs all
          npm --prefix integration/mpp-client test
          npm --prefix integration/mpp-algorand test
          npm --prefix integration/reference-buyer audit --package-lock-only --ignore-scripts --audit-level=high
          npm --prefix integration/mpp-client audit --package-lock-only --ignore-scripts --audit-level=high
          npm --prefix integration/mpp-algorand audit --package-lock-only --ignore-scripts --audit-level=high
      - name: Install locked buyer and seller fixture dependencies
        run: |
          npm --prefix integration/lab ci --ignore-scripts --no-audit --no-fund
          npm --prefix integration/lab/solana-session-contracts ci --ignore-scripts --no-audit --no-fund
      - name: Qualify installable route client and packaged example (offline consumer)
        run: |
          node scripts/check_route_guard_package.mjs
          node scripts/check_native_mpp_package.mjs
      - name: Qualify packed route-guard archive and historical 0.7.1 verifier
        # Digest-check local 0.7.2 pack + SHA256SUMS before install/import.
        # 0.7.1 is the published historical_verifier. No Fly secret, no BATCH
        # enable, no spend. Local qualify is not gated on a GitHub download.
        run: |
          pack_dir="$RUNNER_TEMP/route-guard-pack"
          node scripts/pack_route_guard.mjs --destination="$pack_dir"
          node scripts/check_route_guard_archive.mjs "$pack_dir/402signal-route-guard-0.7.2.tgz" \
            --checksum-file "$pack_dir/SHA256SUMS" \
            --historical-verifier https://github.com/402signalhq/402signal/releases/download/route-guard-v0.7.1/402signal-route-guard-0.7.1.tgz
          PACK_DIR="$pack_dir" node --test scripts/check_route_guard_archive.test.mjs \
            scripts/install_route_guard.test.mjs scripts/exact_authorize.test.mjs
      - name: Check Dockerfile.fly native Algorand layout (no registry or Fly)
        run: node scripts/check_lab_mpp_algorand_image_layout.mjs
      - name: Qualify lab start-seller contract (offline, no image)
        run: node --test integration/lab/start-seller.test.mjs
      - name: Build and test buyer and seller (synthetic payments)
        env:
          LAB_BATCH_PG_DATABASE: lab_batch_ci
          LAB_BATCH_PG_HOST: 127.0.0.1
          LAB_BATCH_PG_USER: postgres
          PGPASSWORD: lab-fixture-password
        # Files share the synthetic PostgreSQL schema. Serialize file setup;
        # explicit concurrent operations inside each test still run unchanged.
        working-directory: integration/lab
        run: |
          npm run build
          node --test --test-concurrency=1 dist/test/*.test.js
      - name: Test isolated Solana session SDK contracts (no RPC or funds)
        run: npm --prefix integration/lab/solana-session-contracts test
      - name: Qualify explicit owner campaigns and bounded recovery (synthetic only)
        run: node --test integration/lab/owner-runtime/campaign-cli.test.mjs integration/lab/owner-runtime/owner-factory.test.mjs integration/batch-buyer/algorand/owner-hooks.test.mjs
      - name: Qualify installable continuation clients (synthetic payments)
        run: |
          npm --prefix integration/session-client ci --ignore-scripts --no-audit --no-fund
          npm --prefix integration/session-client run build
          npm --prefix integration/session-client test
          npm --prefix integration/session-client run test:package
          npm --prefix integration/session-client run test:types
          npm --prefix integration/session-client audit --package-lock-only --ignore-scripts --audit-level=high
      - name: Qualify fresh Algorand manifest owner campaigns (synthetic only)
        # Reuse exact installed lab dependencies; no additional install or wallet.
        run: |
          test ! -e integration/batch-buyer/algorand/node_modules
          test ! -L integration/batch-buyer/algorand/node_modules
          ln -s ../../lab/node_modules integration/batch-buyer/algorand/node_modules
          trap 'rm -f integration/batch-buyer/algorand/node_modules' EXIT
          node --test integration/batch-buyer/algorand/manifest-owner.test.mjs
      - name: Qualify larger Algorand manifests and packaged consumer
        run: node scripts/check_algorand_manifest_package.mjs
      - name: Audit locked lab and Solana dependencies (no updates)
        run: |
          npm --prefix integration/lab audit --package-lock-only --ignore-scripts --audit-level=high
          npm --prefix integration/lab/solana-session-contracts audit --package-lock-only --ignore-scripts --audit-level=high
      - name: Cross-component route contract (loopback only)
        env:
          LIVE402_FIXTURE: "1"
          LIVE402_ROUTE_RPM: "60"
          PYTHONPATH: .:tests
        run: python -m unittest discover -s integration/tests -v
      - name: Official MCP client interoperability (synthetic payments, loopback only)
        env:
          LIVE402_FIXTURE: "1"
        run: |
          npm --prefix integration/mcp ci --ignore-scripts --no-audit --no-fund
          npm --prefix integration/mcp test
          npm --prefix integration/mcp audit --omit=optional --audit-level=high
      # Audit the exact universal hash lock used by CI and the image.
      - name: pip-audit locked requirements (no upgrades)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  lab-fly-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select runner-provided Node 24
        run: |
          node_dir="$(find "$RUNNER_TOOL_CACHE/node" -mindepth 3 -maxdepth 3 -type d -path '*/24.*/x64/bin' -print | sort -V | tail -n 1)"
          test -n "$node_dir"
          "$node_dir/node" -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
          printf '%s\n' "$node_dir" >> "$GITHUB_PATH"
      - name: Synchronize lab SDK for the Fly image context
        run: |
          npm --prefix integration/lab ci --ignore-scripts --no-audit --no-fund
          node integration/lab/sync-sdk.mjs
          test -f integration/lab/sdk/route-guard/batch.mjs
      - name: Build Dockerfile.fly and smoke start-seller
        # Real entrypoint, synthetic volume fixture, pinned NODE_IMAGE.
        # No Fly credentials or production seller-deploy.
        run: |
          printf 'NODE_IMAGE=%s\n' "$(cat integration/lab/node-image.pin)"
          printf 'dockerfile=integration/lab/Dockerfile.fly\n'
          printf 'source_sha=%s\n' "$GITHUB_SHA"
          bash scripts/smoke_lab_fly_image.sh
