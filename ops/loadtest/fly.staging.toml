# Disposable load-test target for the free path (unpaid 402 challenge, preview,
# rails, pulse, health) on production-shaped hardware. Same image and machine
# size as production, no volume, no secrets, no replay authority, no PQ signer,
# so /ready reports not ready and every paid request is refused in-process
# before verification. Test-support modes (LIVE402_FIXTURE, LOCAL_FREE) are
# refused on Fly by the server itself; the paid path is measured locally in
# fixture mode instead (docs/load-test.md).
#
#   flyctl apps create 402signal-staging -o 402testenvironment
#   flyctl deploy -a 402signal-staging -c ops/loadtest/fly.staging.toml \
#     --dockerfile Dockerfile.postgres --remote-only --ha=false \
#     --build-arg GIT_SHA=$(git rev-parse HEAD)
#   ...run ops/loadtest/free-path.js...
#   flyctl apps destroy 402signal-staging -y

app = "402signal-staging"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[env]
  LIVE402_HISTORY_DB = "/tmp/live402-history.sqlite"
  LIVE402_CATALOG_DB = "/tmp/catalog.sqlite"
  LIVE402_REPLAY_DB = "/tmp/live402-replay.sqlite"
  LIVE402_SESSION_DB = "/tmp/live402-session.sqlite"
  LIVE402_PQ_LOG_DB = "/tmp/pq-log-mainnet.sqlite"
  LIVE402_PQ_LOG_EPOCH = "mainnet-v1"
  LIVE402_PQ_LOG_ORIGIN = "402signal.com/pq/log/mainnet-v1"
  LIVE402_PQ_FALCON_NETWORK = "mainnet"
  # Public MainNet Falcon address (same as production fly.toml). Boot refuses
  # a MainNet identity without it; no secret is involved.
  LIVE402_PQ_FALCON_MAINNET_ADDRESS = "GVIAG3YMJ7OLJ3JAUBNI2YP5JCQQCQYWN25UAGLC2BTPOBUL3ZZTILIMWU"
  LIVE402_LEADERSHIP_BACKEND = "none"
  LIVE402_MAX_HANDLERS = "200"
  LIVE402_MAX_PROCESS_PROBES = "32"
  LIVE402_READY_CACHE_S = "5"
  LIVE402_DISCOVERY_CACHE_S = "120"
  LIVE402_DRAIN_S = "10"
  # Rate limits and admission caps out of the way: the test measures capacity, not policy.
  LIVE402_ROUTE_RPM = "1000000"
  LIVE402_PREVIEW_RPM = "1000000"
  LIVE402_PUBLIC_RPM = "1000000"
  LIVE402_VALIDATE_RPM = "1000000"
  LIVE402_ADMISSION_DISCOVERY_GLOBAL = "100000"
  LIVE402_ADMISSION_DISCOVERY_ANONYMOUS = "100000"
  LIVE402_ADMISSION_DISCOVERY_ANONYMOUS_TOTAL = "100000"
  LIVE402_ADMISSION_SESSION_HOP_GLOBAL = "100000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 190

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
  cpus = 1
