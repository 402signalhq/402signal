[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "402signal"
version = "0.1.0"
description = "402Signal client helpers and an offline receipt verifier for x402 and MPP buyers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "402Signal", email = "ross@402signal.com" }]
keywords = ["x402", "mpp", "agent payments", "402", "usdc", "transparency log"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://402signal.com/"
Documentation = "https://402signal.com/developers"
Source = "https://github.com/402signalhq/402signal/tree/main/sdk/python"
Changelog = "https://github.com/402signalhq/402signal/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["signal402"]
