# fly.toml - single paid router app 402signal. No extra hostnames.
# One writer Machine: min_machines_running = 1 plus the writer lease
# (private ops note leadership-lease.md) keep one publisher and one paid router.
# The lease row lives in the replay authority (signal_router, managed variant),
# so a machine without the volume can hold or observe it.
# Replay authority is Fly Managed Postgres via secrets. Catalog, history,
# sessions and the MainNet PQ log stay on the /data volume.
# Never set test-support modes here. Falcon SK is never on this app.

app = "402signal"
primary_region = "iad"
# SIGTERM drains in-flight paid requests for up to LIVE402_DRAIN_S before exit.
kill_signal = "SIGTERM"
kill_timeout = "75s"

[build]
  # Build the Postgres-capable image with an exact build identity:
  #   fly deploy --dockerfile Dockerfile.postgres --build-arg GIT_SHA=$(git rev-parse HEAD)
  # Do not expose FLY_IMAGE_REF or add a public SHA/status endpoint.

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # The proxy queues above the soft limit and sheds above the hard limit, so
  # the process handler cap (LIVE402_MAX_HANDLERS) is never the first limit.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 190

# Liveness gates proxy routing. Readiness must not take the site, docs,
# catalog and unpaid challenges offline: paid work is refused in-process with
# HTTP 503 before verification whenever readiness or the writer lease fails.
[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

# Machine check for durable storage/integrity: visible in Fly, gates deploys.
[checks.ready]
  type = "http"
  port = 8080
  method = "GET"
  path = "/ready"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"

[[vm]]
  # Dedicated vCPU: no shared-CPU throttling under sustained routing load.
  size = "performance-1x"
  memory = "2gb"
  cpus = 1

# 1GB persistent volume for probe history, sessions, catalog.sqlite and pq-log*.sqlite.
# Process-local only. Do not HTTP-serve /data or sqlite files.
# PRODUCTION is MainNet-only. Unset/unknown network must fail closed.
# Live log: /data/pq-log-mainnet.sqlite (epoch mainnet-v1).
# pq-log.sqlite is the archived TestNet shard (TEST SUPPORT only). Do not delete it.
# Do not set TestNet Falcon address, TestNet log SK, TestNet signer HMAC,
# or TestNet broadcast flags here.
# Anchoring flags are operator secrets, never this file.
# Snapshot schedule and off-host copies: docs/backup.md.
[[mounts]]
  source = "data"
  destination = "/data"

[env]
  LIVE402_HISTORY_DB = "/data/live402-history.sqlite"
  LIVE402_CATALOG_DB = "/data/catalog.sqlite"
  LIVE402_REPLAY_DB = "/data/live402-replay.sqlite"
  LIVE402_PQ_LOG_DB = "/data/pq-log-mainnet.sqlite"
  LIVE402_PQ_LOG_EPOCH = "mainnet-v1"
  LIVE402_PQ_LOG_ORIGIN = "402signal.com/pq/log/mainnet-v1"
  # Public MainNet Falcon f1 address (safe to store). Secrets must match MainNet Falcon.
  # TestNet OBHYX... must not appear as a MainNet default.
  LIVE402_PQ_FALCON_MAINNET_ADDRESS = "GVIAG3YMJ7OLJ3JAUBNI2YP5JCQQCQYWN25UAGLC2BTPOBUL3ZZTILIMWU"
  LIVE402_PQ_FALCON_NETWORK = "mainnet"
  # Writer lease and capacity tunables (private ops notes). "postgres" needs
  # ops/router-leadership-managed.sql installed on the replay authority
  # (done before this value changed); "file" is the rollback value and the
  # lock file stays on the volume.
  LIVE402_LEADERSHIP_BACKEND = "postgres"
  # Transparency-leaf outbox (private runbook leaf-outbox.md): a process without the
  # writer lease queues public leaf bytes in the replay authority instead of
  # refusing plain paid checks. The owner migration is installed.
  LIVE402_PQ_OUTBOX = "1"
  # Shared session store (private runbook session-postgres.md): windows, credits,
  # private counters, payer days and alert subscriptions live in the replay
  # authority (signal_session, owner functions installed) so a second machine
  # sees the same ones; the observation cache stays on the volume. The writer
  # copies the local file in once on its first lease acquisition. Remove this
  # line to fall back to the SQLite file (recent rows are not copied back).
  LIVE402_SESSION_BACKEND = "postgres"
  # Probe history replica (private runbook history-postgres.md): every committed
  # change to the SQLite history file is shipped to signal_history on the replay
  # authority (owner functions installed) so a second machine can read the same
  # probes and change clocks. The file stays the reader. Remove this line to stop
  # shipping; nothing reads from PostgreSQL in this step.
  LIVE402_HISTORY_BACKEND = "dual"
  # Shadow catalog replica (private runbook catalog-postgres.md): every committed
  # change to the SQLite catalog file is shipped to signal_catalog on the replay
  # authority (owner functions installed). The file stays the reader. Remove this
  # line to stop shipping; nothing reads from PostgreSQL in this step.
  LIVE402_CATALOG_BACKEND = "dual"
  LIVE402_MAX_HANDLERS = "200"
  LIVE402_MAX_PROCESS_PROBES = "32"
  LIVE402_READY_CACHE_S = "5"
  LIVE402_DISCOVERY_CACHE_S = "120"
  LIVE402_DRAIN_S = "60"
  LIVE402_ADMISSION_DISCOVERY_GLOBAL = "240"
  LIVE402_ADMISSION_DISCOVERY_ANONYMOUS = "20"
  LIVE402_ADMISSION_DISCOVERY_ANONYMOUS_TOTAL = "160"
  LIVE402_ADMISSION_SESSION_HOP_GLOBAL = "400"
